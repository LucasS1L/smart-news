services:
  smartnews-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smartnews-api
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CHROMA_PERSIST_DIR=${CHROMA_PERSIST_DIR:-/data/chroma}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-sentence-transformers/all-mpnet-base-v2}
      - SEARCH_CACHE_TTL=${SEARCH_CACHE_TTL:-300}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://smartnews-frontend:5173,http://localhost:3000}
    volumes:
      - ./backend/app:/app/app
      - chroma_data:/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      - redis

  smartnews-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartnews-frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_API_INTERNAL_URL=${VITE_API_INTERNAL_URL:-http://smartnews-api:8000}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - smartnews-api

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  chroma_data:
